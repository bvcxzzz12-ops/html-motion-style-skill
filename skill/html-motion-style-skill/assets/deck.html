<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>움직이는 발표 · 스타일 예제</title>
<style>
  :root {
    color-scheme: dark;
    --background: #10131c;
    --foreground: #fff9ec;
    --secondary: #d3d2e1;
    --ribbon: #ffe34c;
    --ribbon-text: #191605;
    --accent: #9fc8ff;
    --panel: #222b3d;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-content: center;
    background: #08090d;
    color: var(--foreground);
  }
  [hidden] { display: none !important; }
  .player { width: min(100vw, (100dvh - 4.25rem) * 16 / 9); }
  .stage {
    position: relative;
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    isolation: isolate;
    background: var(--background);
    overflow: hidden;
  }
  .scene {
    position: absolute;
    z-index: 1;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: safe center;
    align-items: flex-start;
    gap: 2.4cqw;
    padding: 6.2cqw 8cqw;
    overflow: auto;
    overscroll-behavior: contain;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .stage::after {
    content: "";
    position: absolute;
    z-index: 0;
    pointer-events: none;
    inset: auto -13% -24% auto;
    width: 47%;
    aspect-ratio: 2;
    transform: rotate(-28deg);
    background: repeating-linear-gradient(90deg, transparent 0 14px, #afc9ff22 14px 16px);
    border: 1px solid #afc9ff33;
  }
  h1, h2, p { margin: 0; }
  h1, h2 {
    font-size: 7.2cqw;
    font-weight: 900;
    letter-spacing: -.065em;
    line-height: 1.14;
  }
  .cover h1 { font-size: 9.2cqw; }
  p, li {
    max-width: 75ch;
    color: var(--secondary);
    font-size: 2.8cqw;
    font-weight: 650;
    line-height: 1.55;
  }
  .ribbon {
    display: inline-block;
    margin: .07em 0 0 .01em;
    padding: .02em .23em .12em .19em;
    transform: rotate(-4deg);
    background: var(--ribbon);
    color: var(--ribbon-text);
    box-shadow: .09em .1em 0 #070b13;
  }
  .underline { color: var(--accent); }
  .takeaway {
    padding: .45em .68em;
    border-inline-start: .22em solid var(--ribbon);
    background: var(--panel);
    color: var(--foreground);
  }
  .sequence { display: grid; gap: 1.1cqw; padding-inline-start: 2.2cqw; margin: 0; }
  .scene.is-entering h1, .scene.is-entering h2 { animation: arrive .48s cubic-bezier(.2,.82,.24,1) both; }
  [data-step].is-entering { animation: rise .35s cubic-bezier(.17,.83,.25,1) both; }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(.23em) scale(.98); }
    72% { opacity: 1; transform: translateY(-.035em); }
    to { opacity: 1; transform: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(.5em); }
    to { opacity: 1; transform: none; }
  }
  .controls {
    min-height: 3.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .45rem;
    padding: .35rem clamp(.45rem, 2.5vw, 1rem);
    background: #151824;
  }
  output { display: inline-block; font-size: .83rem; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: .3rem; }
  button {
    min-height: 2.25rem;
    border: 1px solid #64708b;
    border-radius: .3rem;
    padding: .3rem .6rem;
    background: var(--panel);
    color: var(--foreground);
    font: inherit;
    cursor: pointer;
  }
  button[disabled] { opacity: .48; cursor: default; }
  button:focus-visible, .scene:focus-visible { outline: 2px solid var(--ribbon); outline-offset: -2px; }
  .player:fullscreen { width: min(100vw, (100dvh - 4.25rem) * 16 / 9); margin: auto; background: #08090d; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="player" id="player">
  <div class="stage" id="stage" aria-label="발표 화면">
    <section class="scene cover" aria-labelledby="opening" tabindex="-1">
      <h1 id="opening">아이디어를<br><span class="ribbon">눈앞에</span></h1>
      <p data-step hidden>큰 문장이 먼저 보입니다. 다음 단계에서 설명이 따라옵니다.</p>
    </section>
    <section class="scene" aria-labelledby="middle" tabindex="-1" hidden>
      <h2 id="middle">한 화면에<br><span class="underline">하나의 메시지</span></h2>
      <ol class="sequence">
        <li data-step hidden>제목에서 핵심을 먼저 전합니다.</li>
        <li data-step hidden>설명은 발표하는 순서대로 공개합니다.</li>
      </ol>
    </section>
    <section class="scene" aria-labelledby="ending" tabindex="-1" hidden>
      <h2 id="ending">청중이 기억할<br>한 문장을 남기세요</h2>
      <p class="takeaway" data-step hidden>발표가 끝난 뒤 할 행동을 한 가지로 정리합니다.</p>
    </section>
  </div>
  <nav class="controls" aria-label="발표 조작">
    <output id="status" aria-live="polite">1 / 3 · 1 / 2</output>
    <div class="actions">
      <button id="previous" type="button" aria-label="이전 단계" disabled>이전</button>
      <button id="next" type="button" aria-label="다음 단계">다음</button>
      <button id="fullscreen" type="button" aria-label="전체 화면 전환">전체</button>
    </div>
  </nav>
</main>
<script>
  const player = document.getElementById('player');
  const stage = document.getElementById('stage');
  const scenes = Array.from(stage.querySelectorAll('.scene'));
  const steps = scenes.map(scene => Array.from(scene.querySelectorAll('[data-step]')));
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  const fullscreen = document.getElementById('fullscreen');
  const status = document.getElementById('status');
  let page = 0;
  let step = 0;
  let wheelAt = -Infinity;
  let wheelTotal = 0;
  let wheelLock = -Infinity;

  const atStart = () => page === 0 && step === 0;
  const atEnd = () => page === scenes.length - 1 && step === steps[page].length;
  function paint(enteredScene, enteredStep) {
    scenes.forEach((scene, index) => {
      scene.hidden = page !== index;
      scene.classList.toggle('is-entering', page === index && enteredScene);
      steps[index].forEach((item, position) => {
        item.hidden = page !== index || position >= step;
        item.classList.toggle('is-entering', page === index && enteredStep && position === step - 1);
      });
    });
    if (enteredScene) scenes[page].scrollTop = 0;
    previous.disabled = atStart();
    next.disabled = atEnd();
    status.value = (page + 1) + ' / ' + scenes.length + ' · ' + (step + 1) + ' / ' + (steps[page].length + 1);
  }
  function move(direction) {
    const before = page;
    if (direction > 0 && !atEnd()) {
      if (step < steps[page].length) step++;
      else { page++; step = 0; }
    } else if (direction < 0 && !atStart()) {
      if (step > 0) step--;
      else { page--; step = steps[page].length; }
    } else return;
    paint(page !== before, direction > 0 && page === before);
  }
  function jump(end) {
    page = end ? scenes.length - 1 : 0;
    step = end ? steps[page].length : 0;
    paint(true, false);
  }
  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await player.requestFullscreen();
    } catch {}
  }
  previous.addEventListener('click', () => move(-1));
  next.addEventListener('click', () => move(1));
  fullscreen.addEventListener('click', toggleFullscreen);
  if (!document.fullscreenEnabled) fullscreen.hidden = true;
  const interactive = 'button, a, input, textarea, select, summary, [contenteditable]';
  stage.addEventListener('click', event => {
    if (event.button === 0 && !event.target.closest(interactive) && !String(window.getSelection())) move(1);
  });
  stage.addEventListener('wheel', event => {
    if (event.ctrlKey || event.target.closest(interactive) || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    const scene = scenes[page];
    if (event.deltaY > 0 && scene.scrollTop + scene.clientHeight < scene.scrollHeight - 2 ||
        event.deltaY < 0 && scene.scrollTop > 2) return;
    event.preventDefault();
    const now = performance.now();
    if (now - wheelAt > 160 || Math.sign(wheelTotal) !== Math.sign(event.deltaY)) wheelTotal = 0;
    wheelAt = now;
    if (now < wheelLock) return;
    wheelTotal += event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? stage.clientHeight : 1);
    if (Math.abs(wheelTotal) < 36) return;
    move(wheelTotal > 0 ? 1 : -1);
    wheelTotal = 0;
    wheelLock = now + 360;
  }, {passive: false});
  document.addEventListener('keydown', event => {
    if (event.repeat || event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (event.target.closest(interactive) && [' ', 'Enter'].includes(event.key)) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(event.key)) move(1);
    else if (['ArrowLeft', 'PageUp'].includes(event.key)) move(-1);
    else if (event.key === 'Home') jump(false);
    else if (event.key === 'End') jump(true);
    else if (event.key.toLowerCase() === 'f' && document.fullscreenEnabled) void toggleFullscreen();
    else return;
    event.preventDefault();
  });
  paint(true, false);
</script>
</body>
</html>
